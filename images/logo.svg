<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d8b4fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff0b3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f3cd72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9973d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Left Person (Purple) -->
  <g>
    <!-- Head -->
    <circle cx="45" cy="30" r="15" fill="url(#purpleGrad)"/>
    
    <!-- Body -->
    <ellipse cx="45" cy="70" rx="15" ry="22" fill="url(#purpleGrad)"/>
    
    <!-- Right Arm (extended for handshake) -->
    <path d="M 60 60 Q 90 55 105 70" stroke="url(#purpleGrad)" stroke-width="13" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Right Person (Gold) -->
  <g>
    <!-- Head -->
    <circle cx="155" cy="25" r="15" fill="url(#orangeGrad)"/>
    
    <!-- Body -->
    <ellipse cx="155" cy="70" rx="15" ry="24" fill="url(#orangeGrad)"/>
    
    <!-- Left Arm (extended for handshake) -->
    <path d="M 140 60 Q 110 50 95 70" stroke="url(#orangeGrad)" stroke-width="13" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Handshake Connection -->
  <ellipse cx="100" cy="70" rx="25" ry="15" fill="url(#orangeGrad)" opacity="0.4"/>

  <!-- Calendar Icon -->
  <g transform="translate(120, 50)">
    <!-- Calendar background -->
    <rect x="0" y="0" width="40" height="40" rx="4" fill="#20152c" stroke="url(#orangeGrad)" stroke-width="1.5"/>
    
    <!-- Calendar header -->
    <rect x="0" y="0" width="40" height="10" rx="4" fill="#d9aa50"/>
    
    <!-- Calendar rings -->
    <circle cx="6" cy="6" r="1.5" fill="white"/>
    <circle cx="16" cy="6" r="1.5" fill="white"/>
    <circle cx="26" cy="6" r="1.5" fill="white"/>
    <circle cx="36" cy="6" r="1.5" fill="white"/>
    
    <!-- Calendar grid -->
    <rect x="4" y="14" width="6" height="6" rx="1.5" fill="#d8b4fe"/>
    <rect x="14" y="14" width="6" height="6" rx="1.5" fill="#d8b4fe"/>
    <rect x="24" y="14" width="6" height="6" rx="1.5" fill="#d8b4fe"/>
    
    <!-- Checkmark grid -->
    <rect x="4" y="24" width="6" height="6" rx="1.5" fill="#d8b4fe"/>
    <rect x="14" y="24" width="6" height="6" rx="1.5" fill="#f3cd72"/>
    <rect x="24" y="24" width="6" height="6" rx="1.5" fill="#d8b4fe"/>
    
    <!-- Checkmark -->
    <path d="M 16 25 L 17.5 27 L 20 23" stroke="white" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Orange Arc/Circle around Calendar -->
  <circle cx="140" cy="70" r="32" fill="none" stroke="url(#orangeGrad)" stroke-width="2" opacity="0.5" stroke-dasharray="35, 90"/>
</svg>
