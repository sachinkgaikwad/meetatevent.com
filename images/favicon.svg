<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d8b4fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff0b3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f3cd72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9973d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="#100b16"/>

  <!-- Left Person (Purple) -->
  <g>
    <circle cx="45" cy="50" r="20" fill="url(#purpleGrad)"/>
    <ellipse cx="45" cy="110" rx="20" ry="30" fill="url(#purpleGrad)"/>
    <path d="M 65 90 Q 110 75 125 110" stroke="url(#purpleGrad)" stroke-width="18" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Right Person (Gold) -->
  <g>
    <circle cx="155" cy="45" r="20" fill="url(#orangeGrad)"/>
    <ellipse cx="155" cy="110" rx="20" ry="32" fill="url(#orangeGrad)"/>
    <path d="M 135 90 Q 90 70 75 110" stroke="url(#orangeGrad)" stroke-width="18" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Calendar Icon -->
  <g transform="translate(135, 75)">
    <rect x="0" y="0" width="50" height="50" rx="6" fill="#20152c" stroke="url(#orangeGrad)" stroke-width="2"/>
    <rect x="0" y="0" width="50" height="12" rx="6" fill="#d9aa50"/>
    <circle cx="8" cy="8" r="2" fill="white"/>
    <circle cx="20" cy="8" r="2" fill="white"/>
    <circle cx="32" cy="8" r="2" fill="white"/>
    <circle cx="44" cy="8" r="2" fill="white"/>
    
    <rect x="6" y="20" width="8" height="8" rx="2" fill="#d8b4fe"/>
    <rect x="18" y="20" width="8" height="8" rx="2" fill="#d8b4fe"/>
    <rect x="30" y="20" width="8" height="8" rx="2" fill="#d8b4fe"/>
    
    <rect x="6" y="32" width="8" height="8" rx="2" fill="#d8b4fe"/>
    <rect x="18" y="32" width="8" height="8" rx="2" fill="#f3cd72"/>
    <rect x="30" y="32" width="8" height="8" rx="2" fill="#d8b4fe"/>
    
    <path d="M 20 33 L 22 36 L 26 30" stroke="white" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Gold Arc -->
  <circle cx="160" cy="110" r="45" fill="none" stroke="url(#orangeGrad)" stroke-width="3" opacity="0.6" stroke-dasharray="50, 140"/>
</svg>